/* ==========================================================================
   2. Base / reset
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }

:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html, body { height: 100%; margin: 0; }
main { height: 100%; }

body {
  font-family: var(--font);
  line-height: 1.5;
  color: var(--text);
  text-align: center;
  overflow-x: hidden;
  background: linear-gradient(160deg, #ff9a9e, #fad0c4 40%, #a1c4fd);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1 { margin: 0; font-size: 2rem; text-shadow: var(--text-shadow); }
p  { margin: 0; font-size: 1.1rem; text-shadow: var(--text-shadow); }

/* ==========================================================================
   3. Components
   ========================================================================== */
/* Screens (slides) */
.screen {
  display: none;
  min-height: 100%;
  padding: 24px;
  gap: 16px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.screen.is-active { display: flex; animation: slide-in .6s ease; }

/* Buttons */
.btn {
  font: inherit;
  font-size: 1.15rem;
  font-weight: bold;
  letter-spacing: .3px;
  padding: 12px 28px;
  border: 0;
  border-radius: 30px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  box-shadow: var(--btn-shadow);
  cursor: pointer;
}
.btn:active { transform: translateY(4px); box-shadow: var(--btn-shadow-active); }

/* Text input */
.input {
  font: inherit;
  font-size: 1.2rem;
  width: min(300px, 90%);
  padding: 12px 16px;
  text-align: center;
  outline: none;
  color: #3b2a4a;
  -webkit-text-fill-color: #3b2a4a;
  caret-color: #e8206b;
  -webkit-appearance: none;
  appearance: none;
  -webkit-user-select: text;
  user-select: text;
  touch-action: manipulation;
  border: 3px solid var(--white);
  border-radius: 14px;
  background: var(--input-bg);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .15);
}

/* Bouncing emoji row */
.emoji-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  font-size: 4rem;
}
.emoji-row span {
  display: inline-block;
  text-shadow: 0 4px 6px rgba(0, 0, 0, .25);
  animation: bounce 1s infinite ease-in-out;
}
.emoji-row span:nth-child(2) { animation-delay: .15s; }
.emoji-row span:nth-child(3) { animation-delay: .30s; }
.emoji-row span:nth-child(4) { animation-delay: .45s; }
.emoji-row span:nth-child(5) { animation-delay: .60s; }

/* Gift box */
.gift { position: relative; width: 160px; height: 160px; cursor: pointer; animation: wiggle 1.2s infinite; }
.gift__base {
  position: absolute; bottom: 0; left: 10px;
  width: 140px; height: 100px;
  border-radius: 8px;
  background: linear-gradient(135deg, #ff7aa2, #e8386a);
}
.gift__base::after { content: ""; position: absolute; left: 60px; top: 0; width: 20px; height: 100%; background: #ffd23f; }
.gift__lid {
  position: absolute; top: 22px; left: 0; z-index: 2;
  width: 160px; height: 42px;
  border-radius: 6px;
  background: #e8386a;
  transition: transform .8s, opacity .8s;
}
.gift__lid::after {
  content: "🎀";
  position: absolute; left: 50%; top: -34px;
  transform: translateX(-50%);
  font-size: 2.6rem;
}
.gift.is-open { animation: none; }
.gift.is-open .gift__lid { transform: translate(70px, -110px) rotate(35deg); opacity: 0; }

/* Happy Birthday result */
.headline {
  font-size: 2.4rem;
  color: transparent;
  background: linear-gradient(90deg, #ff5e8a, #ffb300, #7b2ff7);
  -webkit-background-clip: text;
  background-clip: text;
  animation: pop .8s ease;
}
.card {
  max-width: 440px;
  padding: 22px 26px;
  border: 1px solid var(--white);
  border-radius: 24px;
  background: rgba(255, 255, 255, .85);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .18);
}

/* Confetti */
.confetti {
  position: fixed; top: -40px; z-index: 9;
  font-size: 1.6rem;
  pointer-events: none;
  animation: fall linear forwards;
}

/* ==========================================================================
   4. Screen themes
   ========================================================================== */
/* Screen 1 - intro (black, framed) */
.theme-intro {
  position: relative;
  color: var(--white);
  background: radial-gradient(ellipse at 50% 35%, #1b1b24 0%, #000 70%);
}
.theme-intro::before {
  content: ""; position: absolute; inset: 16px;
  border: 3px solid var(--white); border-radius: 18px;
  pointer-events: none;
}
.intro__content {
  width: 100%;
  padding: 0 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px;
}
.intro__title { font-size: clamp(1.6rem, 7vw, 2.4rem); margin-bottom: -8px; font-style: italic; font-weight: bold; line-height: 1.3; animation: fade-up 1.5s ease both; }
.intro__subtitle { width: 100%; font-size: 1.4rem; font-style: italic; font-weight: 600; color: #ffd1e3; animation: fade-up 1.5s .5s ease both; }
.intro__choices {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 16px;
  animation: fade-up 1.5s .8s ease both;
}
.intro__choices .btn {
  width: 148px; height: 54px;
  font-size: 1.02rem;
  padding: 12px 16px;
  font-style: italic;
  white-space: nowrap;
  box-shadow: none;
  transition: transform .15s, translate .45s cubic-bezier(.2, .9, .3, 1.1);
}
.intro__choices .btn:active { transform: scale(.94); box-shadow: none; }

/* Screen 2 - welcome (dark pink blur) */
.theme-welcome {
  --btn-bg: var(--white); --btn-fg: #e8206b;
  --btn-shadow: 0 5px 0 rgba(120, 0, 50, .35); --btn-shadow-active: var(--btn-shadow);
  --text-shadow: 0 2px 10px rgba(120, 0, 50, .45);
  color: var(--white);
  background:
    radial-gradient(circle at 20% 15%, rgba(190, 25, 105, .75) 0, transparent 55%),
    radial-gradient(circle at 85% 40%, rgba(140, 20, 85, .7) 0, transparent 55%),
    radial-gradient(circle at 30% 90%, rgba(110, 15, 70, .8) 0, transparent 60%),
    #1c0613;
}

/* Screen 3 - name (purple) */
.theme-name {
  --btn-bg: var(--white); --btn-fg: #1f5fd6;
  --btn-shadow: 0 5px 0 rgba(0, 15, 50, .4); --btn-shadow-active: var(--btn-shadow);
  --text-shadow: 0 2px 12px rgba(0, 15, 50, .5);
  --input-bg: rgba(255, 255, 255, .95);
  color: var(--white);
  background:
    radial-gradient(circle at 15% 10%, rgba(40, 140, 255, .8) 0, transparent 55%),
    radial-gradient(circle at 90% 35%, rgba(0, 200, 230, .5) 0, transparent 55%),
    radial-gradient(circle at 25% 95%, rgba(30, 80, 200, .6) 0, transparent 60%),
    linear-gradient(160deg, #0d2b66, #061433);
}

/* Screen 4 - birthday date (dark pink) */
.theme-date {
  --btn-bg: var(--white); --btn-fg: #d6246e;
  --btn-shadow: 0 5px 0 rgba(90, 0, 45, .35); --btn-shadow-active: var(--btn-shadow);
  --text-shadow: 0 2px 12px rgba(90, 0, 45, .5);
  --input-bg: rgba(255, 255, 255, .95);
  color: var(--white);
  background:
    linear-gradient(180deg, rgba(110, 16, 72, .55), rgba(46, 6, 32, .72)),
    var(--photo-blur) center / cover no-repeat,
    #2e0620;
}
.rose-line { font-size: 1.25rem; font-style: italic; font-weight: 600; }

/* Screen 5 - gift (dark) */
.theme-gift {
  --text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
  color: var(--white);
  background:
    radial-gradient(circle at 50% 62%, rgba(255, 94, 138, .35) 0, transparent 50%),
    radial-gradient(circle at 15% 10%, rgba(120, 60, 200, .5) 0, transparent 55%),
    radial-gradient(circle at 90% 20%, rgba(255, 179, 0, .22) 0, transparent 50%),
    linear-gradient(160deg, #1a0b2e, #0a0414);
}

/* Screen 6 - result (blurred photo background) */
.theme-result {
  --text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
  color: var(--white);
  background:
    linear-gradient(180deg, rgba(20, 0, 15, .2), rgba(40, 5, 30, .4)),
    var(--photo-blur) center / cover no-repeat,
    #120810;
}
.theme-result { text-transform: uppercase; letter-spacing: 1px; }
.theme-result .headline { font-size: 1.5rem; color: var(--white); background: none; -webkit-background-clip: border-box; background-clip: border-box; text-shadow: var(--text-shadow); }
.theme-result h1 { font-size: 1.3rem; }
.theme-result p { font-size: .85rem; }
.theme-result .card { color: var(--text); }
.theme-result .card p { font-size: .8rem; line-height: 1.7; text-shadow: none; }
.theme-result .btn { font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; }

/* ==========================================================================
   5. Animations
   ========================================================================== */
@keyframes slide-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes fade-up  { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
@keyframes bounce   { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-22px) rotate(6deg); } }
@keyframes wiggle   { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes pop      { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes fall     { to { transform: translateY(110vh) rotate(540deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>
<main>

  <!-- 1. Intro -->
  <section class="screen theme-intro is-active" id="screen-intro">
    <div class="intro__content">
      <h1 class="intro__title">Hii..Kaise ho !! 🥀</h1>
      <p class="intro__subtitle">Yaad hun ya bhul gye?</p>
      <div class="intro__choices">
        <button type="button" class="btn" id="btn-know">I know</button>
        <button type="button" class="btn" id="btn-dont-know">I don't know</button>
      </div>
    </div>
  </section>

  <!-- 2. Welcome -->
  <section class="screen theme-welcome" id="screen-welcome">
    <h1>Heyyy! 👋</h1>
    <p>Someone made a surprise just for you...</p>
    <button type="button" class="btn" id="btn-start">Start the surprise ✨</button>
  </section>

  <!-- 3. Name -->
  <section class="screen theme-name" id="screen-name">
    <div class="emoji-row" aria-hidden="true"><span>🎂</span></div>
    <h1>Write your name Chahat..!! 💝</h1>
    <input class="input" id="input-name" type="text" placeholder="Type your name" maxlength="30" autocomplete="off" autocapitalize="words" enterkeyhint="next" aria-label="Your name">
    <button type="button" class="btn" id="btn-name-next">Next ➜</button>
  </section>

  <!-- 4. Birthday date -->
  <section class="screen theme-date" id="screen-date">
    <div class="emoji-row" aria-hidden="true"><span>🌹</span></div>
    <h1 id="greeting"></h1>
    <p class="rose-line">A rose for you 🌹</p>
    <p>Write your birthday date 🎂</p>
    <input class="input" id="input-date" type="date" aria-label="Your birthday">
    <button type="button" class="btn" id="btn-date-next">Next ➜</button>
  </section>

  <!-- 5. Gift -->
  <section class="screen theme-gift" id="screen-gift">
    <h1>A small gift for you 🎁</h1>
    <p>Tap the box to open it</p>
    <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the gift">
      <div class="gift__lid"></div>
      <div class="gift__base"></div>
    </div>
  </section>

  <!-- 6. Happy Birthday -->
  <section class="screen theme-result" id="screen-result">
    <div class="headline">|| Happy Birthday ||</div>
    <h1 id="result-name"></h1>
    <p id="result-date"></p>
    <div class="card"><p id="result-message"></p></div>
    <button type="button" class="btn" id="btn-confetti">More confetti! 🎊</button>
  </section>

</main>

<script>
'use strict';

/* ✏️ EDIT THESE: your name and your message for your friend */
const CONFIG = {
  from: '',   // optional: add your name here to sign the message
  message: 'Firse happy birthday !! Zyada kuch nhi birthday wish krne ke liye ye sab kiya tha ab iske alawa pareshan nahi karuga wishing you a most happiest birthday I know my wishes are useless but firrr bhi happy birthday and byee...Orr hannn Exams ache se dena boards ke itna hi kahuga orr kuch nhi byee....',
};

const CONFETTI_EMOJI = ['🎉', '🎊', '🎈', '⭐', '💖', '🎂'];
const REVEAL_DELAY_MS = 1600;
const DODGE_MARGIN_PX = 34;

const state = { userName: '', dodgeX: 0, dodgeY: 0 };

const $ = (id) => document.getElementById(id);
const screens = document.querySelectorAll('.screen');

/* ---------- Navigation ---------- */
function showScreen(id) {
  screens.forEach((s) => s.classList.toggle('is-active', s.id === id));
}

/* ---------- Screen 1: "I don't know" button dodges ---------- */
function dodgeButton() {
  const btn = $('btn-dont-know');
  const r = btn.getBoundingClientRect();
  const m = DODGE_MARGIN_PX;

  // Bounds relative to the button's un-translated position
  const minX = m - (r.left - state.dodgeX);
  const maxX = window.innerWidth - m - (r.right - state.dodgeX);
  const minY = m - (r.top - state.dodgeY);
  const maxY = window.innerHeight - m - (r.bottom - state.dodgeY);

  state.dodgeX = minX + Math.random() * (maxX - minX);
  state.dodgeY = minY + Math.random() * (maxY - minY);
  btn.style.translate = `${state.dodgeX}px ${state.dodgeY}px`;
}

/* ---------- Form steps ---------- */
function submitName() {
  const input = $('input-name');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  state.userName = name;
  $('greeting').textContent = `Nice to meet you, ${name}! 💗`;
  showScreen('screen-date');
}

function submitDate() {
  const input = $('input-date');
  if (!input.value) { input.focus(); return; }
  showScreen('screen-gift');
}

/* ---------- Gift reveal ---------- */
function openGift() {
  const gift = $('gift');
  if (gift.classList.contains('is-open')) return;
  gift.classList.add('is-open');
  launchConfetti();

  setTimeout(() => {
    const birthday = new Date(`${$('input-date').value}T00:00:00`);
    $('result-name').textContent = `${state.userName}! 🧿`;
    $('result-date').textContent = 'Born on ' + birthday.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    $('result-message').textContent = CONFIG.from ? `${CONFIG.message}  — ${CONFIG.from} 💖` : CONFIG.message;
    showScreen('screen-result');
    launchConfetti();
  }, REVEAL_DELAY_MS);
}

/* ---------- Confetti ---------- */
function launchConfetti(count = 40) {
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti';
    piece.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
    piece.style.left = `${Math.random() * 100}vw`;
    piece.style.animationDuration = `${2 + Math.random() * 3}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5500);
  }
}

/* ---------- Event wiring ---------- */
$('btn-know').addEventListener('click', () => showScreen('screen-welcome'));
$('btn-dont-know').addEventListener('click', dodgeButton);
$('btn-start').addEventListener('click', () => showScreen('screen-name'));
$('btn-name-next').addEventListener('click', submitName);
$('btn-date-next').addEventListener('click', submitDate);
$('btn-confetti').addEventListener('click', () => launchConfetti());

$('input-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });
$('input-date').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitDate(); });
document.querySelectorAll('.input').forEach((el) =>
  el.addEventListener('focus', () => setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 300))
);

const gift = $('gift');
gift.addEventListener('click', openGift);
gift.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } });
</script>
</body>
</html>
